name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Stable FPC 3.2.2 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15-intel
          - platform: Windows
            runner: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Install stable FPC on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fp-compiler-3.2.2 \
            fp-units-fcl-3.2.2 \
            fp-utils-3.2.2 \
            lcl-utils-3.0

      - name: Install stable FPC on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install fpc

      - name: Install stable FPC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uri = 'https://downloads.freepascal.org/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.i386-win32.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'fpc-3.2.2.i386-win32.exe'
          $expectedHash = '7ec78b1790ecac7685f440b17f9e03865bc09846b7c068a9270c4d37704b5ac8'
          $installDirectory = 'C:\FPC\3.2.2'
          $fpcDirectory = Join-Path $installDirectory 'bin/i386-win32'
          $fpcPath = Join-Path $fpcDirectory 'fpc.exe'

          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "FPC installer checksum mismatch: $actualHash"
          }

          $process = Start-Process $installer -Wait -PassThru -WindowStyle Hidden -ArgumentList @(
            '/SP-'
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/DIR=$installDirectory"
          )
          if ($process.ExitCode -ne 0) {
            throw "FPC installer exited with code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $fpcPath)) {
            throw "FPC was not installed at $fpcPath."
          }

          $fpcDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FPC=$fpcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify stable FPC version
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(fpc -iV)" = '3.2.2'

      - name: Verify stable FPC version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedVersion = (& $env:FPC -iV).Trim()
          if ($installedVersion -ne '3.2.2') {
            throw "Expected FPC 3.2.2, found $installedVersion."
          }

      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./build.sh

      - name: Build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Validate FPM and Lazarus packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p \
            build/fpm/bootstrap/units \
            build/fpm/bootstrap/bin
          fpc -B -Mobjfpc -Sa -Cr -Co -Ci \
            -FUbuild/fpm/bootstrap/units \
            -FEbuild/fpm/bootstrap/bin \
            fpmake.pp
          ./build/fpm/bootstrap/bin/fpmake build \
            --globalunitdir=/usr/lib/x86_64-linux-gnu/fpc/3.2.2
          lazbuild -B --no-write-project wfc.lpk
          lazbuild -B --no-write-project test/wfc_test.lpi
          ./build/lazarus/test/bin/wfc_test
          test -z "$(git status --short)"

  pas2js:
    name: pas2js 3.3.1 (Node.js 22 and Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAS2JS_REVISION: fa10c59214cd226c60af465c831d66a7321f0214
      PAS2JS_SOURCE_SHA256: 5a2ad292c8606b899ba384d81b97e789171a335759b67e338d4a37903dbe18f1
      FPC_SOURCE_REVISION: a92f381365576b6b64be9eb9b8a2db5b4609d8a5
      FPC_SOURCE_SHA256: 27b2588f5ddcfa1f3262728d525f7a5ef382cc8d15c717431cc42d2af5197301
      PAS2JS_ROOT: ${{ runner.temp }}/wfc-pas2js

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Select Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2

      - name: Restore pinned pas2js toolchain
        id: pas2js-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PAS2JS_ROOT }}
          key: pas2js-${{ runner.os }}-${{ runner.arch }}-fpc-3.2.2-${{ env.PAS2JS_REVISION }}-${{ env.FPC_SOURCE_REVISION }}-v1

      - name: Build pinned pas2js toolchain
        if: steps.pas2js-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fp-compiler-3.2.2 \
            fp-units-fcl-3.2.2 \
            fp-utils-3.2.2

          build_root="$(mktemp -d)"
          trap 'rm -rf "$build_root"' EXIT
          pas2js_archive="$build_root/pas2js.tar.gz"
          fpc_archive="$build_root/fpc-source.tar.gz"
          pas2js_source="$build_root/pas2js"

          curl --fail --location --retry 3 \
            --output "$pas2js_archive" \
            "https://gitlab.com/freepascal.org/fpc/pas2js/-/archive/$PAS2JS_REVISION/pas2js-$PAS2JS_REVISION.tar.gz"
          curl --fail --location --retry 3 \
            --output "$fpc_archive" \
            "https://gitlab.com/freepascal.org/fpc/source/-/archive/$FPC_SOURCE_REVISION/source-$FPC_SOURCE_REVISION.tar.gz"
          printf '%s  %s\n' "$PAS2JS_SOURCE_SHA256" "$pas2js_archive" |
            sha256sum --check -
          printf '%s  %s\n' "$FPC_SOURCE_SHA256" "$fpc_archive" |
            sha256sum --check -

          mkdir -p "$pas2js_source/compiler"
          tar -xzf "$pas2js_archive" \
            --strip-components=1 --directory "$pas2js_source"
          tar -xzf "$fpc_archive" \
            --strip-components=1 --directory "$pas2js_source/compiler"
          make -C "$pas2js_source" clean all

          test ! -e "$PAS2JS_ROOT"
          mkdir -p \
            "$PAS2JS_ROOT/bin/x86_64-linux" \
            "$PAS2JS_ROOT/compiler/utils/pas2js"
          cp \
            "$pas2js_source/bin/x86_64-linux/pas2js" \
            "$pas2js_source/bin/x86_64-linux/pas2js.cfg" \
            "$PAS2JS_ROOT/bin/x86_64-linux/"
          cp -a "$pas2js_source/packages" "$PAS2JS_ROOT/"
          cp -a \
            "$pas2js_source/compiler/utils/pas2js/dist" \
            "$PAS2JS_ROOT/compiler/utils/pas2js/"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          test -x "$pas2js"
          test "$("$pas2js" -iV)" = '3.3.1'
          "$pas2js" -iW
          node --version

      - name: Build and run pas2js conformance
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          test_units='build/pas2js/test/units'
          test_bin='build/pas2js/test/bin'
          world_test_units='build/pas2js/world-test/units'
          world_test_bin='build/pas2js/world-test/bin'
          settlement_test_units='build/pas2js/settlement-test/units'
          settlement_test_bin='build/pas2js/settlement-test/bin'
          learning_test_units='build/pas2js/learning-test/units'
          learning_test_bin='build/pas2js/learning-test/bin'
          pattern_test_units='build/pas2js/pattern-test/units'
          pattern_test_bin='build/pas2js/pattern-test/bin'
          pattern_pass_test_units='build/pas2js/pattern-pass-test/units'
          pattern_pass_test_bin='build/pas2js/pattern-pass-test/bin'
          sequence_test_units='build/pas2js/sequence-test/units'
          sequence_test_bin='build/pas2js/sequence-test/bin'
          text_test_units='build/pas2js/text-test/units'
          text_test_bin='build/pas2js/text-test/bin'
          text_pass_test_units='build/pas2js/text-pass-test/units'
          text_pass_test_bin='build/pas2js/text-pass-test/bin'
          negotiation_test_units='build/pas2js/negotiation-test/units'
          negotiation_test_bin='build/pas2js/negotiation-test/bin'
          selective_negotiation_test_units='build/pas2js/selective-negotiation-test/units'
          selective_negotiation_test_bin='build/pas2js/selective-negotiation-test/bin'
          voxel_test_units='build/pas2js/voxel-test/units'
          voxel_test_bin='build/pas2js/voxel-test/bin'
          building_test_units='build/pas2js/building-test/units'
          building_test_bin='build/pas2js/building-test/bin'
          trace_test_units='build/pas2js/trace-test/units'
          trace_test_bin='build/pas2js/trace-test/bin'
          viewer_test_units='build/pas2js/viewer-test/units'
          viewer_test_bin='build/pas2js/viewer-test/bin'
          music_test_units='build/pas2js/music-test/units'
          music_test_bin='build/pas2js/music-test/bin'
          artifact_test_units='build/pas2js/artifact-test/units'
          artifact_test_bin='build/pas2js/artifact-test/bin'
          example_units='build/pas2js/example/units'
          example_bin='build/pas2js/example/bin'
          world_example_units='build/pas2js/world-example/units'
          world_example_bin='build/pas2js/world-example/bin'
          settlement_example_units='build/pas2js/settlement-example/units'
          settlement_example_bin='build/pas2js/settlement-example/bin'
          repair_example_units='build/pas2js/repair-example/units'
          repair_example_bin='build/pas2js/repair-example/bin'
          learned_pattern_example_units='build/pas2js/learned-pattern-example/units'
          learned_pattern_example_bin='build/pas2js/learned-pattern-example/bin'
          learning_example_units='build/pas2js/learning-example/units'
          learning_example_bin='build/pas2js/learning-example/bin'
          corpus_example_units='build/pas2js/corpus-example/units'
          corpus_example_bin='build/pas2js/corpus-example/bin'
          pattern_example_units='build/pas2js/pattern-example/units'
          pattern_example_bin='build/pas2js/pattern-example/bin'
          sequence_example_units='build/pas2js/sequence-example/units'
          sequence_example_bin='build/pas2js/sequence-example/bin'
          text_example_units='build/pas2js/text-example/units'
          text_example_bin='build/pas2js/text-example/bin'
          text_pass_example_units='build/pas2js/text-pass-example/units'
          text_pass_example_bin='build/pas2js/text-pass-example/bin'
          music_example_units='build/pas2js/music-example/units'
          music_example_bin='build/pas2js/music-example/bin'
          spatial_example_units='build/pas2js/spatial-example/units'
          spatial_example_bin='build/pas2js/spatial-example/bin'
          trace_example_units='build/pas2js/trace-example/units'
          trace_example_bin='build/pas2js/trace-example/bin'
          negotiation_example_units='build/pas2js/negotiation-example/units'
          negotiation_example_bin='build/pas2js/negotiation-example/bin'
          building_example_units='build/pas2js/building-example/units'
          building_example_bin='build/pas2js/building-example/bin'
          mkdir -p \
            "$test_units" "$test_bin" \
            "$world_test_units" "$world_test_bin" \
            "$settlement_test_units" "$settlement_test_bin" \
            "$learning_test_units" "$learning_test_bin" \
            "$pattern_test_units" "$pattern_test_bin" \
            "$pattern_pass_test_units" "$pattern_pass_test_bin" \
            "$sequence_test_units" "$sequence_test_bin" \
            "$text_test_units" "$text_test_bin" \
            "$text_pass_test_units" "$text_pass_test_bin" \
            "$negotiation_test_units" "$negotiation_test_bin" \
            "$selective_negotiation_test_units" "$selective_negotiation_test_bin" \
            "$voxel_test_units" "$voxel_test_bin" \
            "$building_test_units" "$building_test_bin" \
            "$trace_test_units" "$trace_test_bin" \
            "$viewer_test_units" "$viewer_test_bin" \
            "$music_test_units" "$music_test_bin" \
            "$artifact_test_units" "$artifact_test_bin" \
            "$example_units" "$example_bin" \
            "$world_example_units" "$world_example_bin" \
            "$settlement_example_units" "$settlement_example_bin" \
            "$repair_example_units" "$repair_example_bin" \
            "$learned_pattern_example_units" "$learned_pattern_example_bin" \
            "$learning_example_units" "$learning_example_bin" \
            "$corpus_example_units" "$corpus_example_bin" \
            "$pattern_example_units" "$pattern_example_bin" \
            "$sequence_example_units" "$sequence_example_bin" \
            "$text_example_units" "$text_example_bin" \
            "$text_pass_example_units" "$text_pass_example_bin" \
            "$music_example_units" "$music_example_bin" \
            "$spatial_example_units" "$spatial_example_bin" \
            "$trace_example_units" "$trace_example_bin" \
            "$negotiation_example_units" "$negotiation_example_bin" \
            "$building_example_units" "$building_example_bin"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$test_units" -FE"$test_bin" test/wfc_test.lpr
          node "$test_bin/wfc_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$world_test_units" -FE"$world_test_bin" \
            test/wfc_world2d_test.lpr
          node "$world_test_bin/wfc_world2d_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$settlement_test_units" -FE"$settlement_test_bin" \
            test/wfc_world2d_settlement_test.lpr
          node "$settlement_test_bin/wfc_world2d_settlement_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$learning_test_units" -FE"$learning_test_bin" \
            test/wfc_learn_test.lpr
          node "$learning_test_bin/wfc_learn_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$pattern_test_units" -FE"$pattern_test_bin" \
            test/wfc_pattern2d_test.lpr
          node "$pattern_test_bin/wfc_pattern2d_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$pattern_pass_test_units" -FE"$pattern_pass_test_bin" \
            test/wfc_pattern2d_passes_test.lpr
          node "$pattern_pass_test_bin/wfc_pattern2d_passes_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$sequence_test_units" -FE"$sequence_test_bin" \
            test/wfc_sequence_test.lpr
          node "$sequence_test_bin/wfc_sequence_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$text_test_units" -FE"$text_test_bin" \
            test/wfc_text_test.lpr
          node "$text_test_bin/wfc_text_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$text_pass_test_units" -FE"$text_pass_test_bin" \
            test/wfc_text_passes_test.lpr
          node "$text_pass_test_bin/wfc_text_passes_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$negotiation_test_units" -FE"$negotiation_test_bin" \
            test/wfc_negotiation_test.lpr
          node "$negotiation_test_bin/wfc_negotiation_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$selective_negotiation_test_units" \
            -FE"$selective_negotiation_test_bin" \
            test/wfc_selective_negotiation_test.lpr
          node "$selective_negotiation_test_bin/wfc_selective_negotiation_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$voxel_test_units" -FE"$voxel_test_bin" \
            test/wfc_voxel3d_test.lpr
          node "$voxel_test_bin/wfc_voxel3d_test.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$building_test_units" -FE"$building_test_bin" \
            test/wfc_building3d_test.lpr
          node "$building_test_bin/wfc_building3d_test.js"

          for trace_test in \
            wfc_trace_reference_test \
            wfc_trace_test \
            wfc_trace_utility_test
          do
            "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
              -FU"$trace_test_units" -FE"$trace_test_bin" \
              "test/$trace_test.lpr"
            node "$trace_test_bin/$trace_test.js"
          done

          for viewer_test in \
            wfc_voxel3d_isometric_test \
            wfc_voxel3d_svg_test \
            wfc_building3d_view_test
          do
            "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
              -Fuexamples/3D/common \
              -FU"$viewer_test_units" -FE"$viewer_test_bin" \
              "test/$viewer_test.lpr"
            node "$viewer_test_bin/$viewer_test.js"
          done

          for music_test in \
            wfc_midi_smf_test \
            wfc_music_test \
            wfc_music_graph_test \
            wfc_music_midi_test \
            wfc_music_passes_test \
            wfc_music_passes_text_test
          do
            "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
              -FU"$music_test_units" -FE"$music_test_bin" \
              "test/$music_test.lpr"
            node "$music_test_bin/$music_test.js"
          done

          for artifact_test in \
            wfc_text_codec_test \
            wfc_rule_model_test \
            wfc_rule_text_test \
            wfc_pipeline_model_test \
            wfc_pipeline_text_test \
            wfc_token_lookup_test \
            wfc_pipeline_compile_test \
            wfc_pipeline_run_test \
            wfc_pipeline_run_text_test \
            wfc_pipeline_result_test \
            wfc_pipeline_result_text_test \
            wfc_pipeline_runtime_test \
            wfc_validate_app_test \
            wfc_run_app_test
          do
            "$pas2js" -B -Tnodejs -Mdelphi -Fusrc -Futools \
              -FU"$artifact_test_units" -FE"$artifact_test_bin" \
              "test/$artifact_test.lpr"
            node "$artifact_test_bin/$artifact_test.js"
          done

          for portable_host in wfc_validate_node wfc_run_node
          do
            "$pas2js" -B -Tnodejs -Mdelphi -Fusrc -Futools \
              -FU"$artifact_test_units" -FE"$artifact_test_bin" \
              "tools/$portable_host.lpr"
            node "$artifact_test_bin/$portable_host.js" --version
          done

          bash test/wfc_pipeline_cli_process_test.sh \
            node "$artifact_test_bin/wfc_validate_node.js" -- \
            node "$artifact_test_bin/wfc_run_node.js"

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$example_units" -FE"$example_bin" \
            examples/text/01_SimpleTiledWorld/SimpleTiledWorld.lpr
          node "$example_bin/SimpleTiledWorld.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -Fuexamples/2D/common \
            -FU"$world_example_units" -FE"$world_example_bin" \
            examples/2D/01_MultiPassWorld/MultiPassWorld.lpr
          node "$world_example_bin/MultiPassWorld.js" 0 >/dev/null
          node "$world_example_bin/MultiPassWorld.js" >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -Fuexamples/2D/common \
            -FU"$settlement_example_units" -FE"$settlement_example_bin" \
            examples/2D/03_SelectiveSettlement/SelectiveSettlement.lpr
          node "$settlement_example_bin/SelectiveSettlement.js" 0 >/dev/null
          node "$settlement_example_bin/SelectiveSettlement.js" >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -Fuexamples/2D/04_NegotiatedRepair \
            -FU"$repair_example_units" -FE"$repair_example_bin" \
            examples/2D/04_NegotiatedRepair/NegotiatedRepairNode.lpr
          node "$repair_example_bin/NegotiatedRepairNode.js" >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -Fuexamples/2D/05_LearnedPatternWorld \
            -FU"$learned_pattern_example_units" \
            -FE"$learned_pattern_example_bin" \
            examples/2D/05_LearnedPatternWorld/LearnedPatternWorldNode.lpr
          node "$learned_pattern_example_bin/LearnedPatternWorldNode.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$learning_example_units" -FE"$learning_example_bin" \
            examples/learning/01_LearnTiles/LearnTiles.lpr
          node "$learning_example_bin/LearnTiles.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$corpus_example_units" -FE"$corpus_example_bin" \
            examples/learning/02_LearnCorpus/LearnCorpus.lpr
          node "$corpus_example_bin/LearnCorpus.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$pattern_example_units" -FE"$pattern_example_bin" \
            examples/learning/03_LearnPatterns/LearnPatterns.lpr
          node "$pattern_example_bin/LearnPatterns.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -FU"$sequence_example_units" -FE"$sequence_example_bin" \
            examples/sequence/01_LearnSequence/LearnSequence.lpr
          node "$sequence_example_bin/LearnSequence.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -Fuexamples/text/02_ConstraintCompletion \
            -FU"$text_example_units" -FE"$text_example_bin" \
            examples/text/02_ConstraintCompletion/ConstraintCompletionNode.lpr
          node "$text_example_bin/ConstraintCompletionNode.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
            -Fuexamples/text/03_PassComposition \
            -FU"$text_pass_example_units" -FE"$text_pass_example_bin" \
            examples/text/03_PassComposition/TextPassCompositionNode.lpr
          node "$text_pass_example_bin/TextPassCompositionNode.js" 0 >/dev/null

          "$pas2js" -B -Tnodejs -Mdelphi -Fusrc \
