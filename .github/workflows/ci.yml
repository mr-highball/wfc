name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Stable FPC 3.2.2 (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15-intel
          - platform: Windows
            runner: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Install stable FPC on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fp-compiler-3.2.2 \
            fp-units-fcl-3.2.2 \
            fp-utils-3.2.2 \
            lcl-utils-3.0

      - name: Install stable FPC on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install fpc

      - name: Install stable FPC on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $uri = 'https://downloads.freepascal.org/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.i386-win32.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'fpc-3.2.2.i386-win32.exe'
          $expectedHash = '7ec78b1790ecac7685f440b17f9e03865bc09846b7c068a9270c4d37704b5ac8'
          $installDirectory = 'C:\FPC\3.2.2'
          $fpcDirectory = Join-Path $installDirectory 'bin/i386-win32'
          $fpcPath = Join-Path $fpcDirectory 'fpc.exe'

          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "FPC installer checksum mismatch: $actualHash"
          }

          $process = Start-Process $installer -Wait -PassThru -WindowStyle Hidden -ArgumentList @(
            '/SP-'
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/DIR=$installDirectory"
          )
          if ($process.ExitCode -ne 0) {
            throw "FPC installer exited with code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $fpcPath)) {
            throw "FPC was not installed at $fpcPath."
          }

          $fpcDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FPC=$fpcPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify stable FPC version
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(fpc -iV)" = '3.2.2'

      - name: Verify stable FPC version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installedVersion = (& $env:FPC -iV).Trim()
          if ($installedVersion -ne '3.2.2') {
            throw "Expected FPC 3.2.2, found $installedVersion."
          }

      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./build.sh

      - name: Build and test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Check tracked asset inventory and bytes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$(mktemp -d "$PWD/build/asset-check.XXXXXXXX")"
          checker="$PWD/build/native/bin/wfc_asset_check"
          git -c core.quotepath=false ls-files --full-name > "$evidence/tracked-paths.txt"
          "$checker" --inventory-from "$evidence/tracked-paths.txt" \
            > "$evidence/inventory.stdout" 2> "$evidence/inventory.stderr"
          test ! -s "$evidence/inventory.stderr"
          mv "$evidence/inventory.stdout" "$evidence/tracked.wfcfiles"
          # A matching byte inventory is not a legal-provenance verdict.
          # Keep unresolved records visible; reviewed releases use the separate
          # --require-reviewed gate documented in docs/assets.md.
          "$checker" --root "$PWD" --manifest "$PWD/ASSETS.wfcassets" \
            --files "$evidence/tracked.wfcfiles"

      - name: Check tracked asset inventory and bytes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD ('build/asset-check-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $checker = Join-Path $PWD 'build/native/bin/wfc_asset_check.exe'
          function Invoke-AssetCapture {
            param([string] $Executable, [string[]] $Arguments, [string] $Name)
            $info = [System.Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $Executable
            $info.WorkingDirectory = "$PWD"
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($argument in $Arguments) { $info.ArgumentList.Add($argument) }
            $process = [System.Diagnostics.Process]::new()
            $output = [System.IO.MemoryStream]::new()
            $errorOutput = [System.IO.MemoryStream]::new()
            try {
              $process.StartInfo = $info
              if (-not $process.Start()) { throw "Could not start $Name" }
              $outTask = $process.StandardOutput.BaseStream.CopyToAsync($output)
              $errTask = $process.StandardError.BaseStream.CopyToAsync($errorOutput)
              if (-not $process.WaitForExit(60000)) { throw "$Name timed out" }
              if (-not [System.Threading.Tasks.Task]::WaitAll(
                  [System.Threading.Tasks.Task[]] @($outTask, $errTask), 5000)) {
                throw "$Name output draining timed out"
              }
              # These trusted-child capture allowances are checked after
              # capture, not claimed as a hostile-process memory sandbox.
              if ($output.Length -gt 64MB -or $errorOutput.Length -gt 1MB) {
                throw "$Name exceeded the capture allowance"
              }
              [System.IO.File]::WriteAllBytes((Join-Path $evidence "$Name.stdout"), $output.ToArray())
              [System.IO.File]::WriteAllBytes((Join-Path $evidence "$Name.stderr"), $errorOutput.ToArray())
              if ($process.ExitCode -ne 0 -or $errorOutput.Length -ne 0) {
                throw "$Name failed: exit $($process.ExitCode); see $evidence"
              }
              return ,$output.ToArray()
            } finally {
              try {
                if ($process.Id -and -not $process.HasExited) {
                  $process.Kill()
                  if (-not $process.WaitForExit(5000)) { throw "$Name did not exit after termination" }
                }
                if ($outTask -and $errTask) {
                  if (-not [System.Threading.Tasks.Task]::WaitAll(
                      [System.Threading.Tasks.Task[]] @($outTask, $errTask), 5000)) {
                    throw "$Name output draining did not finish during cleanup"
                  }
                }
              } finally {
                $process.Dispose()
                $output.Dispose()
                $errorOutput.Dispose()
              }
            }
          }
          $raw = Invoke-AssetCapture (Get-Command git).Source @(
            '-c', 'core.quotepath=false', 'ls-files', '--full-name') 'tracked'
          $rawPath = Join-Path $evidence 'tracked-paths.txt'
          [System.IO.File]::WriteAllBytes($rawPath, $raw)
          $canonical = Invoke-AssetCapture $checker @('--inventory-from', $rawPath) 'inventory'
          $inventory = Join-Path $evidence 'tracked.wfcfiles'
          [System.IO.File]::WriteAllBytes($inventory, $canonical)
          $report = Invoke-AssetCapture $checker @('--root', "$PWD", '--manifest',
            (Join-Path $PWD 'ASSETS.wfcassets'), '--files', $inventory) 'check'
          [System.Text.Encoding]::UTF8.GetString($report)

      - name: Validate FPM and Lazarus packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p \
            build/fpm/bootstrap/units \
            build/fpm/bootstrap/bin
          fpc -B -Mobjfpc -Sa -Cr -Co -Ci \
            -FUbuild/fpm/bootstrap/units \
            -FEbuild/fpm/bootstrap/bin \
            fpmake.pp
          ./build/fpm/bootstrap/bin/fpmake build \
            --globalunitdir=/usr/lib/x86_64-linux-gnu/fpc/3.2.2
          ./build/fpm/bootstrap/bin/fpmake install \
            --globalunitdir=/usr/lib/x86_64-linux-gnu/fpc/3.2.2 \
            --prefix="$PWD/build/package-install" \
            --baseinstalldir="$PWD/build/package-install/" \
            --unitinstalldir="$PWD/build/package-install/units/x86_64-linux/wfc"
          check_package_consumer() {
            local kind="$1"
            local package_units="$2"
            mkdir -p "build/package-consumer/$kind/units" "build/package-consumer/$kind/bin"
            # Ignore compiler configuration: only standard FPC units and this
            # package's compiled output are visible, never the repository src.
            fpc -n -Mdelphi -Sa -Cr -Co -Ci \
              '-Fu/usr/lib/x86_64-linux-gnu/fpc/3.2.2/units/x86_64-linux/*' \
              "-Fu$package_units" \
              "-FUbuild/package-consumer/$kind/units" \
              "-FEbuild/package-consumer/$kind/bin" \
              test/wfc_package_consumer.lpr
            "./build/package-consumer/$kind/bin/wfc_package_consumer"
          }
          check_package_consumer fpm "$PWD/build/package-install/units/x86_64-linux/wfc"
          lazbuild -B --no-write-project wfc.lpk
          check_package_consumer lazarus "$PWD/build/lazarus/package/x86_64-linux"
          lazbuild -B --no-write-project test/wfc_test.lpi
          ./build/lazarus/test/bin/wfc_test
          lazbuild -B --no-write-project examples/music/01_simple_A_major/simple_a_major.lpi
          lazbuild -B --no-write-project examples/music/02_simple_song_riffs/simple_song_riffs.lpi
          ./build/lazarus/music-studies/bin/simple_a_major --notes 3 --seed 55
          ./build/lazarus/music-studies/bin/simple_song_riffs --notes 3 --seed 55
          package_changes="$(git status --short)"
          if test -n "$package_changes"; then
            printf 'Package validation changed the checkout:\n%s\n' "$package_changes"
            git diff --stat
            exit 1
          fi

  pas2js:
    name: pas2js 3.3.1 (FPC server and browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAS2JS_REVISION: fa10c59214cd226c60af465c831d66a7321f0214
      PAS2JS_SOURCE_SHA256: 5a2ad292c8606b899ba384d81b97e789171a335759b67e338d4a37903dbe18f1
      FPC_SOURCE_REVISION: a92f381365576b6b64be9eb9b8a2db5b4609d8a5
      FPC_SOURCE_SHA256: 27b2588f5ddcfa1f3262728d525f7a5ef382cc8d15c717431cc42d2af5197301

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Set pas2js toolchain directory
        shell: bash
        run: printf 'PAS2JS_ROOT=%s/wfc-pas2js\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Restore pinned pas2js toolchain
        id: pas2js-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PAS2JS_ROOT }}
          key: pas2js-${{ runner.os }}-${{ runner.arch }}-fpc-3.2.2-${{ env.PAS2JS_REVISION }}-${{ env.FPC_SOURCE_REVISION }}-v1

      - name: Build pinned pas2js toolchain
        if: steps.pas2js-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fp-compiler-3.2.2 \
            fp-units-fcl-3.2.2 \
            fp-utils-3.2.2

          build_root="$(mktemp -d)"
          trap 'rm -rf "$build_root"' EXIT
          pas2js_archive="$build_root/pas2js.tar.gz"
          fpc_archive="$build_root/fpc-source.tar.gz"
          pas2js_source="$build_root/pas2js"

          curl --fail --location --retry 3 \
            --output "$pas2js_archive" \
            "https://gitlab.com/freepascal.org/fpc/pas2js/-/archive/$PAS2JS_REVISION/pas2js-$PAS2JS_REVISION.tar.gz"
          curl --fail --location --retry 3 \
            --output "$fpc_archive" \
            "https://gitlab.com/freepascal.org/fpc/source/-/archive/$FPC_SOURCE_REVISION/source-$FPC_SOURCE_REVISION.tar.gz"
          printf '%s  %s\n' "$PAS2JS_SOURCE_SHA256" "$pas2js_archive" |
            sha256sum --check -
          printf '%s  %s\n' "$FPC_SOURCE_SHA256" "$fpc_archive" |
            sha256sum --check -

          mkdir -p "$pas2js_source/compiler"
          tar -xzf "$pas2js_archive" \
            --strip-components=1 --directory "$pas2js_source"
          tar -xzf "$fpc_archive" \
            --strip-components=1 --directory "$pas2js_source/compiler"
          make -C "$pas2js_source" clean all

          test ! -e "$PAS2JS_ROOT"
          mkdir -p \
            "$PAS2JS_ROOT/bin/x86_64-linux" \
            "$PAS2JS_ROOT/compiler/utils/pas2js"
          cp \
            "$pas2js_source/bin/x86_64-linux/pas2js" \
            "$pas2js_source/bin/x86_64-linux/pas2js.cfg" \
            "$PAS2JS_ROOT/bin/x86_64-linux/"
          cp -a "$pas2js_source/packages" "$PAS2JS_ROOT/"
          cp -a \
            "$pas2js_source/compiler/utils/pas2js/dist" \
            "$PAS2JS_ROOT/compiler/utils/pas2js/"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          test -x "$pas2js"
          test "$("$pas2js" -iV)" = '3.3.1'
          "$pas2js" -iW

      - name: Build FPC browser development tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fp-compiler-3.2.2 fp-units-fcl-3.2.2 fp-utils-3.2.2
          mkdir -p build/native/bin build/native/tools-units
          for tool in wfc_serve wfc_browser_check wfc_browser_capture; do
            fpc -B -Mdelphi -Sa -Cr -Co -Ci -Futools \
              -FUbuild/native/tools-units -FEbuild/native/bin "tools/$tool.lpr"
          done

      - name: Stage portable browser programs and demo entries
        shell: bash
        run: |
          PAS2JS="$PAS2JS_ROOT/bin/x86_64-linux/pas2js" bash ./build-browser-tests.sh

      - name: Run portable browser conformance and demo entries
        shell: bash
        run: |
          bash ./test-browser-tests.sh

      - name: Verify native browser capture completion and rejection
        shell: bash
        run: bash ./test/browser_capture/run.sh

      - name: Build browser Ensemble Studio
        shell: bash
        run: |
          # Its shared controller event path runs in browser conformance above.
          PAS2JS="$PAS2JS_ROOT/bin/x86_64-linux/pas2js" bash ./build-browser-ensemble.sh

      - name: Build browser Voice Studio
        shell: bash
        run: |
          PAS2JS="$PAS2JS_ROOT/bin/x86_64-linux/pas2js" bash ./build-browser-voices.sh

      - name: Verify spatial demos and Pipeline Workspace in the real entry matrix
        shell: bash
        run: |
          # The maintained runner above loads all twelve actual index pages.
          # Require its connectivity-specific repair/rollback checks as well
          # as a compiled standalone bundle; a synthetic fixture is not enough.
          PAS2JS="$PAS2JS_ROOT/bin/x86_64-linux/pas2js" bash ./build-browser-connectivity.sh
          ./build/native/bin/wfc_browser_check \
            --dom build/browser/tests/results/wfc_browser_demo_entries_test.dom \
            --expect 'data-demo-entries-self-test=passed' \
            --expect 'data-demo-entries-count=12' \
            --expect 'data-demo-entry-workspace=passed' \
            --expect 'data-demo-entry-mapped=passed' \
            --expect 'data-demo-entry-connectivity=passed' \
            --expect 'data-demo-entry-terraces=passed'
          # Workspace ordinary startup does not solve or claim a self-test.
          # Its separate real-entry UI fixture must finish every async stage.
          ./build/native/bin/wfc_browser_check \
            --dom build/browser/tests/results/pipeline_workspace_ui_test.dom \
            --expect 'data-self-test=passed' \
            --expect 'data-workspace-ui-self-test=passed' \
            --expect 'data-workspace-ui-stage-count=14' \
            --expect 'data-workspace-ui-current=complete'
          for stage in startup cancelled-queue preset-drafts initial-once \
            draft-isolation seed-epochs cell-inputs failed-repair private-scope \
            view-window geometry journal-claims file-import restored-history; do
            ./build/native/bin/wfc_browser_check \
              --dom build/browser/tests/results/pipeline_workspace_ui_test.dom \
              --expect "data-workspace-ui-$stage=passed"
          done

      - name: Build and self-test browser text passes
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          PAS2JS="$pas2js" bash ./build-browser-text.sh

          bash ./test-browser-tests.sh --root build/browser/text-passes/www \
            --page 'index.html?selftest=1' \
            --expect 'data-state=solved' \
            --expect 'data-self-test=passed' \
            --expect 'data-signature=1:69ABA6CE' \
            --expect 'data-output-signature=1:69ABA6CE' \
            --expect 'data-pass-count=3' \
            --expect 'data-trace-hash=2412171679' \
            --expect 'data-output=A sun rises brightly!'

      - name: Build and self-test browser Training Studio
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          PAS2JS="$pas2js" bash ./build-browser-training.sh

          bash ./test-browser-tests.sh --root build/browser/training/www \
            --page 'index.html?selftest=1' \
            --expect 'data-state=solved' \
            --expect 'data-self-test=passed' \
            --expect 'data-source-signature=0FA2C5EA' \
            --expect 'data-recipe-signature=DBCBA621' \
            --expect 'data-result-signature=947C4AFD' \
            --expect 'data-connectivity-edit=passed' \
            --expect 'data-connectivity-replay=passed' \
            --expect 'data-connectivity-contradiction=passed' \
            --expect 'data-connectivity-invalidation=passed' \
            --expect 'data-connectivity-volume=passed' \
            --expect 'data-circular-sequence=passed' \
            --expect 'data-overlapping-volume=passed' \
            --expect 'data-overlapping-volume-view=passed' \
            --expect 'data-overlapping-volume-recovery=passed' \
            --expect 'data-volume-view-isolation=passed' \
            --expect 'data-volume-layout=passed' \
            --expect 'data-cell-count=16' \
            --expect 'data-source-invalidation=passed' \
            --expect 'data-run-invalidation=passed' \
            --expect 'data-contradiction=passed' \
            --expect 'data-recovery=passed' \
            --expect 'data-preset-sweep=passed' \
            --expect 'data-import-race=passed'

      - name: Build and self-test browser Music Studio
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          PAS2JS="$pas2js" bash ./build-browser-music.sh

          bash ./test-browser-tests.sh --root build/browser/music/www \
            --page 'index.html?selftest=1' \
            --expect 'data-state=solved' \
            --expect 'data-self-test=passed' \
            --expect 'data-seed=0' \
            --expect 'data-composition-signature=216F6EBB' \
            --expect 'data-result-status=solved' \
            --expect 'data-score-signature=4167E7E5' \
            --expect 'data-midi-signature=86E4DCA3' \
            --expect 'data-wave-signature=64679FF8' \
            --expect 'data-strategy=negotiated' \
            --expect 'data-scope=full' \
            --expect 'data-cell-count=16' \
            --expect 'data-lock-count=0' \
            --expect 'data-pass-count=3' \
            --expect 'data-midi-bytes=123' \
            --expect 'data-wav-bytes=352844' \
            --expect 'data-arrangement-test=passed' \
            --expect 'data-arrangement-4-frames=176400' \
            --expect 'data-arrangement-6-frames=264600' \
            --expect 'data-arrangement-180-frames=7938000' \
            --expect 'data-arrangement-cancel=passed' \
            --expect 'data-arrangement-stale=passed' \
            --expect 'data-arrangement-write-failure=passed' \
            --expect 'data-arrangement-commit=passed' \
            --expect 'data-new-session-invalidation=passed' \
            --expect 'data-run-invalidation=passed' \
            --expect 'data-failure-clears-output=passed' \
            --expect 'data-motif-lock=passed' \
            --expect 'data-selective-regeneration=passed' \
            --expect 'data-recovery=passed' \
            --expect 'data-audio-ready=true' \
            --expect 'data-audio-play-events=0'

      - name: Build and self-test browser world
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          PAS2JS="$pas2js" bash ./build-browser.sh

          bash ./test-browser-tests.sh --root build/browser/world2d/www \
            --page 'index.html?selftest=1' \
            --expect 'data-state=solved' \
            --expect 'data-self-test=passed' \
            --expect 'data-signature=1:5B0DD75D:08022AF1:A40D0955'

      - name: Build and self-test browser Building 3D
        shell: bash
        run: |
          pas2js="$PAS2JS_ROOT/bin/x86_64-linux/pas2js"
          PAS2JS="$pas2js" bash ./build-browser-building3d.sh

          bash ./test-browser-tests.sh --root build/browser/building3d/www \
            --page 'index.html?selftest=1' \
            --expect 'data-state=solved' \
            --expect 'data-self-test=passed' \
            --expect 'data-signature=1:F1EF0EB6' \
            --expect 'data-view-signature=AC7290C0' \
            --expect 'data-face-count=140'

      - name: Build and self-test browser Neighborhood Counts
        shell: bash
        run: |
          PAS2JS="$PAS2JS_ROOT/bin/x86_64-linux/pas2js" bash ./build-browser-counts.sh
          bash ./test-browser-tests.sh --root build/browser/counts/www \
            --page 'index.html?selftest=1' \
            --expect 'data-state=solved' \
            --expect 'data-self-test=passed' \
            --expect 'data-output-key=LLLLLLLLL/.R.R...../....M....' \
            --expect 'data-lower=passed' \
            --expect 'data-upper=passed' \
            --expect 'data-alias=passed' \
            --expect 'data-repair=passed' \
            --expect 'data-flood=passed' \
            --expect 'data-invalidation=passed'

  development:
    name: Development FPC (official trunk image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Build and test with current FPC trunk
        shell: bash
        run: |
          docker pull freepascal/fpc:trunk-bookworm-full
          docker image inspect \
            --format 'FPC trunk image: {{index .RepoDigests 0}}' \
            freepascal/fpc:trunk-bookworm-full
          docker run --rm freepascal/fpc:trunk-bookworm-full fpc -iW
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            freepascal/fpc:trunk-bookworm-full \
            bash ./build.sh
